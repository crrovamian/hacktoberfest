<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PisoMatch</title>
    <style>
        :root {
            --bg: #f3f4f6; --card: #fff; --ink: #1f2937; --muted: #4b5563;
            --like: #16a34a; --nope: #dc2626; --brand: #e11d48; --border: #e5e7eb;
            --shadow: 0 12px 30px rgba(0, 0, 0, .12);
        }
        * { box-sizing: border-box; }
        :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--ink); min-height: 100dvh;
               display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background: var(--brand); color: #fff; padding: 14px 16px;
                 display: flex; align-items: center; justify-content: space-between; gap: 12px;
                 position: sticky; top: 0; z-index: 5; }
        header h1 { font-size: 1.25rem; margin: 0; letter-spacing: .5px; }
        header h1 span { opacity: .9; font-weight: 400; }
        .who { display: flex; align-items: center; gap: 10px; font-size: .9rem; flex-wrap: wrap; justify-content: flex-end; }
        .who a { color: #fff; font-size: .9rem; }
        .notif-btn { position: relative; border: none; background: rgba(255,255,255,.18); color: #fff; border-radius: 999px;
                     width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
        .notif-btn:hover { background: rgba(255,255,255,.28); }
        .notif-badge { position: absolute; top: -4px; right: -4px; background: #fff; color: var(--brand); border-radius: 999px;
                       font-size: .75rem; font-weight: 700; padding: 0 6px; min-width: 20px; text-align: center; }
        .notif-badge[hidden] { display: none; }
        select { border: none; border-radius: 8px; padding: 6px 10px; font-size: .9rem;
                 background: #fff; color: var(--ink); }
        main { width: 100%; max-width: 420px; padding: 16px; flex: 1; }
        .deck { position: relative; height: min(64dvh, 560px); min-height: 420px; touch-action: none; }
        .card { position: absolute; inset: 0; background: var(--card); border-radius: 18px;
                box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
                will-change: transform; user-select: none; }
        .card.dragging { transition: none; }
        .card .photo { flex: 1 1 55%; min-height: 220px; background-size: cover; background-position: center;
                       background-color: #e5e7eb; position: relative; }
        .card .photo::after { content: ""; position: absolute; inset: 0;
                              background: linear-gradient(to top, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 55%); }
        .badge { position: absolute; top: 14px; right: 14px; background: rgba(17,24,39,.7);
                 color: #fff; padding: 6px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; z-index: 1; }
        .badge.high { background: var(--like); } .badge.mid { background: #d97706; }
        .card .info { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; }
        .card .info h2 { margin: 0; font-size: 1.3rem; display: flex; align-items: baseline; gap: 8px; }
        .card .info h2 small { color: var(--muted); font-weight: 400; }
        .card .info .place { color: var(--muted); font-size: .9rem; }
        .card .info .bio { font-size: .92rem; line-height: 1.4; margin: 2px 0 4px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { font-size: .78rem; background: #f9fafb; border: 1px solid var(--border);
               border-radius: 999px; padding: 3px 9px; color: var(--ink); }
        .tag.strong { background: #fef2f2; border-color: #fecaca; font-weight: 600; }
        .empty { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; text-align: center;
                 color: var(--muted); padding: 24px; gap: 10px; }
        .empty button { border: none; background: var(--brand); color: #fff; border-radius: 999px;
                         padding: 8px 16px; font-weight: 600; cursor: pointer; }
        .actions { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 18px; }
        .actions button { width: 68px; height: 68px; border-radius: 50%; border: none;
                          font-size: 1.8rem; cursor: pointer; box-shadow: var(--shadow);
                          background: #fff; transition: transform .12s ease, opacity .12s ease; display: flex;
                          align-items: center; justify-content: center; }
        .actions button:hover:not(:disabled) { transform: scale(1.08); }
        .actions button:active:not(:disabled) { transform: scale(.98); }
        .actions button:disabled { opacity: .4; cursor: default; transform: none; }
        .actions .nope { color: var(--nope); border: 2px solid #fee2e2; }
        .actions .like { color: var(--like); border: 2px solid #dcfce7; }
        .actions .undo { width: 52px; height: 52px; font-size: 1.2rem; color: var(--muted); border: 1px solid var(--border); }
        .matches { margin-top: 28px; }
        .matches h3 { font-size: 1rem; margin: 0 0 10px; }
        .match-list { display: flex; flex-direction: column; gap: 8px; }
        .match-row { display: flex; align-items: center; gap: 12px; background: #fff;
                     border-radius: 12px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05);
                     cursor: pointer; text-align: left; border: 1px solid transparent; width: 100%; font: inherit; }
        .match-row:hover { background: #fafafa; }
        .match-row:focus-visible { border-color: #2563eb; }
        .match-row img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #e5e7eb; }
        .match-row .m-info { flex: 1; display: flex; flex-direction: column; }
        .match-row .m-name { font-weight: 600; }
        .match-row .m-sub { font-size: .82rem; color: var(--muted); }
        .match-row .chat-hint { margin-left: auto; color: var(--brand); font-size: .85rem; display: flex; align-items: center; gap: 8px; }
        .unread-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
        .no-matches { color: var(--muted); font-size: .9rem; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        .overlay { position: fixed; inset: 0; background: rgba(17,24,39,.92); color: #fff;
                   display: none; flex-direction: column; align-items: center; justify-content: center;
                   text-align: center; padding: 24px; z-index: 30; }
        .overlay.show { display: flex; }
        .overlay[aria-hidden="true"] { display: none; }
        .overlay-box { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 320px; animation: pop .18s ease; }
        @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .overlay h2 { font-size: 2rem; margin: 0; }
        .overlay p { margin: 0; opacity: .95; }
        .overlay img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
                        border: 4px solid #fff; margin: 12px 0; background: #e5e7eb; }
        .overlay-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 12px; }
        .overlay button { background: #fff; color: #111827; border: none; border-radius: 999px;
                          padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .overlay button.primary { background: var(--brand); color: #fff; }

        /* Toast */
        .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
                 background: rgba(17,24,39,.96); color: #fff; padding: 10px 16px; border-radius: 999px;
                 font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s ease, bottom .2s ease; z-index: 40; }
        .toast.show { opacity: 1; bottom: 26px; }

        /* Chat */
        .chat { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
                align-items: flex-end; justify-content: center; z-index: 25; }
        .chat.show { display: flex; }
        .chat[aria-hidden="true"] { display: none; }
        .chat-box { background: var(--bg); width: 100%; max-width: 420px; height: min(86dvh, 680px);
                    border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
        .chat-head { background: var(--brand); color: #fff; padding: 12px 16px; display: flex;
                     align-items: center; gap: 10px; }
        .chat-head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #e5e7eb; }
        .chat-head .name { font-weight: 600; flex: 1; }
        .chat-head button { background: transparent; border: none; color: #fff; font-size: 1.4rem;
                            cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .chat-head button:hover { background: rgba(255,255,255,.18); }
        .chat-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; font-size: .92rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        .msg.mine { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
        .msg.theirs { align-self: flex-start; background: #fff; border: 1px solid var(--border);
                      border-bottom-left-radius: 4px; }
        .chat-form { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid var(--border); }
        .chat-form input { flex: 1; border: 1px solid var(--border); border-radius: 999px;
                           padding: 10px 14px; font-size: .95rem; }
        .chat-form button { background: var(--brand); color: #fff; border: none; border-radius: 999px;
                            padding: 0 18px; font-weight: 600; cursor: pointer; }
        .chat-form button:disabled { opacity: .55; cursor: default; }

        @media (max-width: 420px) {
            header { flex-direction: column; align-items: flex-start; }
            .who { width: 100%; justify-content: space-between; }
            main { padding: 12px; }
            .actions { gap: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
            .card { transition: none; }
            .overlay-box { animation: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Piso<span>Match</span> 🏠</h1>
        <div class="who">
            <a href="/ui/usuarios">Ver usuarios ↗</a>
            <button type="button" id="notif-btn" class="notif-btn" aria-label="Mensajes sin leer">
                💬
                <span id="notif-badge" class="notif-badge" hidden>0</span>
            </button>
            <div>
                <label for="me">Eres:</label>
                <select id="me"></select>
            </div>
        </div>
    </header>

    <main>
        <div class="deck" id="deck" aria-live="polite" aria-label="Mazo de candidatos"></div>

        <div class="actions">
            <button class="undo" id="btn-undo" title="Deshacer último swipe" aria-label="Deshacer último swipe" disabled>↺</button>
            <button class="nope" id="btn-nope" title="Pasar" aria-label="Pasar">✕</button>
            <button class="like" id="btn-like" title="Me interesa" aria-label="Me interesa">♥</button>
        </div>
        <p class="sr-only">Usa las flechas izquierda/derecha para pasar o dar me gusta. Pulsa Escape para cerrar ventanas.</p>

        <section class="matches">
            <h3>Tus matches <span style="font-weight:400;color:var(--muted);font-size:.85rem;">(toca para chatear)</span></h3>
            <div class="match-list" id="matches"></div>
        </section>
    </main>

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-hidden="true">
        <div class="overlay-box">
            <h2 id="overlay-title">¡Es un match! 🎉</h2>
            <p id="overlay-text"></p>
            <img id="overlay-img" alt="Foto del usuario con el que has hecho match">
            <div class="overlay-actions">
                <button class="primary" id="overlay-chat">Enviar mensaje</button>
                <button id="overlay-close">Seguir buscando</button>
            </div>
        </div>
    </div>

    <div class="chat" id="chat" role="dialog" aria-modal="true" aria-labelledby="chat-name" aria-hidden="true">
        <div class="chat-box">
            <div class="chat-head">
                <img id="chat-img" alt="">
                <span class="name" id="chat-name">Chat</span>
                <button id="chat-close" aria-label="Cerrar chat">✕</button>
            </div>
            <div class="chat-msgs" id="chat-msgs" aria-live="polite"></div>
            <form class="chat-form" id="chat-form">
                <input id="chat-input" placeholder="Escribe un mensaje..." autocomplete="off" aria-label="Mensaje">
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const API = '/api/v1';
        const $ = (id) => document.getElementById(id);

        let meId = null;
        let queue = [];
        let chatWith = null;
        const history = [];
        let lastFocused = null;
        let toastTimer = null;
        const unread = new Map();
        let unreadPoll = null;

        async function api(path, options) {
            const res = await fetch(API + path, {
                headers: { 'Content-Type': 'application/json' }, ...options,
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ message: res.statusText }));
                throw new Error(err.message || 'Error');
            }
            return res.status === 204 ? null : res.json();
        }

        async function loadPeople() {
            const people = await api('/usuarios');
            const sel = $('me');
            sel.innerHTML = '';
            people.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.id;
                opt.textContent = `${u.nombre}` + (u.profesion ? ` · ${u.profesion}` : '');
                sel.appendChild(opt);
            });
            meId = people.length ? people[0].id : null;
            sel.value = meId;
        }

        function tagsFor(perfil) {
            if (!perfil) return [{ text: 'Sin perfil de convivencia', strong: false }];
            const tags = [
                { text: `💶 ${perfil.presupuesto}€/mes`, strong: true },
                { text: `📍 ${perfil.ciudad}`, strong: false }
            ];
            if (perfil.fechaEntrada) tags.push({ text: `📅 Entrada: ${perfil.fechaEntrada}`, strong: false });
            if (perfil.habitos) tags.push({ text: `🏷 ${perfil.habitos}`, strong: false });
            if (perfil.preferencias) tags.push({ text: `🤝 ${perfil.preferencias}`, strong: false });
            return tags;
        }

        function badgeClass(score) {
            if (score >= 70) return 'high';
            if (score >= 40) return 'mid';
            return '';
        }

        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function renderDeck() {
            const deck = $('deck');
            deck.innerHTML = '';
            if (queue.length === 0) {
                deck.innerHTML = '<div class="empty"><p>No hay más usuarios por ahora.<br>Cambia de usuario o vuelve más tarde.</p><button type="button" onclick="document.getElementById(\'me\').focus()">Cambiar usuario</button></div>';
                setButtons(false);
                $('btn-undo').disabled = history.length === 0;
                return;
            }
            const top = Math.min(2, queue.length);
            for (let i = top - 1; i >= 0; i--) {
                const c = queue[i];
                const u = c.usuario;
                const card = document.createElement('article');
                card.className = 'card';
                card.tabIndex = -1;
                card.setAttribute('aria-label', `${u.nombre}, ${u.edad}. ${c.compatibilidad}% compatible`);
                card.style.transform = `scale(${1 - i * 0.03}) translateY(${i * -8}px)`;
                card.style.zIndex = String(top - i);
                const foto = u.foto ? `url('${u.foto.replace(/'/g, "\\'")}')` : 'none';
                const tags = tagsFor(c.perfil).map(t => `<span class="tag${t.strong ? ' strong' : ''}">${escapeHtml(t.text)}</span>`).join('');
                card.innerHTML = `
                    <div class="photo" style="background-image:${foto}">
                        <span class="badge ${badgeClass(c.compatibilidad)}" title="Compatibilidad calculada con tus preferencias">${c.compatibilidad}% compatible</span>
                    </div>
                    <div class="info">
                        <h2>${escapeHtml(u.nombre)} <small>${u.edad}</small></h2>
                        <div class="place">${escapeHtml(u.profesion || '')}</div>
                        <div class="bio">${escapeHtml(u.descripcion || '')}</div>
                        <div class="tags">${tags}</div>
                    </div>`;
                deck.appendChild(card);
            }
            setButtons(true);
            $('btn-undo').disabled = history.length === 0;
        }

        function setButtons(enabled) {
            $('btn-like').disabled = !enabled;
            $('btn-nope').disabled = !enabled;
        }

        async function loadDeck() {
            if (!meId) return;
            try {
                queue = await api(`/usuarios/${meId}/discover`);
            } catch (e) {
                showToast('No se han podido cargar los candidatos');
                queue = [];
            }
            renderDeck();
        }

        async function refreshUnread() {
            if (!meId) return;
            try {
                const res = await api(`/usuarios/${meId}/mensajes/sin-leer`);
                const total = res.total || 0;
                const badge = $('notif-badge');
                if (total > 0) {
                    badge.textContent = total > 9 ? '9+' : total;
                    badge.hidden = false;
                } else {
                    badge.hidden = true;
                }
                for (const m of document.querySelectorAll('.match-row')) {
                    const id = m.dataset.userId;
                    const dot = m.querySelector('.unread-dot');
                    if (dot) dot.hidden = !(unread.get(Number(id)) > 0);
                }
            } catch (e) {
                // ignore
            }
        }

        async function loadMatches() {
            if (!meId) return;
            try {
                const matches = await api(`/usuarios/${meId}/matches`);
                const list = $('matches');
                if (matches.length === 0) {
                    list.innerHTML = '<div class="no-matches">Aún no tienes matches. ¡Empieza a deslizar!</div>';
                    await refreshUnread();
                    return;
                }
                const unreadMap = new Map();
                await Promise.all(matches.map(async m => {
                    try {
                        const r = await api(`/usuarios/${meId}/mensajes/sin-leer/${m.con.id}`);
                        if (r.total > 0) unreadMap.set(m.con.id, r.total);
                    } catch (e) {}
                }));
                unread.clear();
                for (const [k,v] of unreadMap) unread.set(k,v);
                list.innerHTML = '';
                matches.forEach(m => {
                    const row = document.createElement('button');
                    row.className = 'match-row';
                    row.type = 'button';
                    row.dataset.userId = m.con.id;
                    row.setAttribute('aria-label', `Chatear con ${m.con.nombre}, ${m.con.edad}`);
                    const hasUnread = unread.get(m.con.id) > 0;
                    row.innerHTML = `
                        <img src="${m.con.foto || ''}" alt="" loading="lazy" width="44" height="44">
                        <div class="m-info">
                            <div class="m-name">${escapeHtml(m.con.nombre)}, ${m.con.edad}</div>
                            <div class="m-sub">${escapeHtml(m.con.profesion || '')}</div>
                        </div>
                        <span class="chat-hint"><span class="unread-dot" ${hasUnread ? '' : 'hidden'}></span>💬 Chatear</span>`;
                    row.onclick = () => openChat(m.con);
                    list.appendChild(row);
                });
                await refreshUnread();
            } catch (e) {
                $('matches').innerHTML = '<div class="no-matches">No se han podido cargar los matches.</div>';
            }
        }

        async function swipe(liked) {
            if (queue.length === 0) return;
            const current = queue.shift();
            history.push({ card: current, liked });
            setButtons(false);
            renderDeck();
            try {
                const result = await api(`/usuarios/${meId}/swipes`, {
                    method: 'POST',
                    body: JSON.stringify({ objetivoId: current.usuario.id, liked }),
                });
                if (result.matched) {
                    showMatch(result.matchedWith);
                    loadMatches();
                }
            } catch (e) {
                // Rollback on failure
                queue.unshift(current);
                history.pop();
                showToast('No se ha podido guardar tu decisión. Se ha revertido.');
                renderDeck();
                return;
            } finally {
                $('btn-undo').disabled = history.length === 0;
                if (queue.length > 0 && history.length >= 0) setButtons(true);
            }
        }

        function undo() {
            if (history.length === 0) return;
            const last = history.pop();
            queue.unshift(last.card);
            $('btn-undo').disabled = history.length === 0;
            renderDeck();
            showToast('Último swipe deshecho');
        }

        function showMatch(usuario) {
            const overlay = $('overlay');
            $('overlay-text').textContent = `Tú y ${usuario.nombre} os habéis gustado.`;
            const img = $('overlay-img');
            img.src = usuario.foto || '';
            img.alt = `Foto de ${usuario.nombre}`;
            overlay.dataset.matchedUser = JSON.stringify(usuario);
            lastFocused = document.activeElement;
            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            setTimeout(() => $('overlay-chat').focus(), 50);
        }

        // --- Chat ---
        async function openChat(usuario) {
            chatWith = usuario;
            $('chat-name').textContent = usuario.nombre;
            const img = $('chat-img');
            img.src = usuario.foto || '';
            img.alt = `Foto de ${usuario.nombre}`;
            const chat = $('chat');
            chat.classList.add('show');
            chat.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            lastFocused = document.activeElement;
            setTimeout(() => $('chat-input').focus(), 50);
            unread.delete(usuario.id);
            await loadConversation();
            await loadMatches();
            await refreshUnread();
        }

        async function loadConversation() {
            try {
                const msgs = await api(`/usuarios/${meId}/mensajes/${chatWith.id}`);
                const box = $('chat-msgs');
                box.innerHTML = msgs.map(m => {
                    const mine = m.emisorId === meId;
                    const leido = mine && m.leido ? ' · leído' : '';
                    return `<div class="msg ${mine ? 'mine' : 'theirs'}">${escapeHtml(m.contenido)}<div style="font-size:.72rem;opacity:.7;margin-top:4px;text-align:right;">${new Date(m.fecha).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}${leido}</div></div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
                await refreshUnread();
            } catch (e) {
                showToast('No se ha podido cargar la conversación');
            }
        }

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'" :'&#39;' }[c]));
        }

        $('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = $('chat-input');
            const btn = $('chat-form').querySelector('button');
            const text = input.value.trim();
            if (!text || !chatWith) return;
            input.disabled = true;
            btn.disabled = true;
            try {
                await api(`/usuarios/${meId}/mensajes`, {
                    method: 'POST',
                    body: JSON.stringify({ receptorId: chatWith.id, contenido: text }),
                });
                input.value = '';
                await loadConversation();
            } catch (err) {
                showToast(err.message || 'No se ha podido enviar el mensaje');
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
            }
        };

        function closeChat() {
            const chat = $('chat');
            chat.classList.remove('show');
            chat.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
            loadMatches();
            refreshUnread();
        }

        function closeOverlay() {
            const overlay = $('overlay');
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
        }

        $('chat-close').onclick = closeChat;
        $('overlay-close').onclick = closeOverlay;
        $('overlay-chat').onclick = () => {
            try {
                const data = JSON.parse($('overlay').dataset.matchedUser || '{}');
                closeOverlay();
                if (data && data.id) openChat(data);
            } catch (e) {
                closeOverlay();
            }
        };
        $('notif-btn').onclick = () => {
            const first = document.querySelector('.match-row');
            if (first) first.click();
            else showToast('No tienes matches con mensajes sin leer');
        };
        $('btn-like').onclick = () => swipe(true);
        $('btn-nope').onclick = () => swipe(false);
        $('btn-undo').onclick = undo;
        $('me').onchange = (e) => {
            meId = Number(e.target.value);
            history.length = 0;
            $('btn-undo').disabled = true;
            unread.clear();
            loadDeck();
            loadMatches();
            if (unreadPoll) clearInterval(unreadPoll);
            unreadPoll = setInterval(refreshUnread, 15000);
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const overlay = $('overlay');
                const chat = $('chat');
                if (overlay.classList.contains('show')) { closeOverlay(); return; }
                if (chat.classList.contains('show')) { closeChat(); return; }
            }
            if (e.key === 'ArrowRight') { if (!$('btn-like').disabled) swipe(true); }
            if (e.key === 'ArrowLeft') { if (!$('btn-nope').disabled) swipe(false); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
        });

        (async function init() {
            await loadPeople();
            await loadDeck();
            await loadMatches();
            if (unreadPoll) clearInterval(unreadPoll);
            unreadPoll = setInterval(refreshUnread, 15000);
        })();
    </script>
</body>
</html>
