<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PisoMatch</title>
    <style>
        :root {
            --bg: #f3f4f6; --card: #fff; --ink: #1f2937; --muted: #6b7280;
            --brand: #ff5a5f; --border: #e5e7eb; --like: #22c55e;
            --shadow: 0 4px 16px rgba(0,0,0,.08);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--ink); }
        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }
        header.top { background: var(--brand); color: #fff; padding: 14px 20px;
                     display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        header.top h1 { font-size: 1.25rem; margin: 0; letter-spacing: .5px; }
        header.top h1 span { opacity: .85; font-weight: 400; }
        header.top nav a { color: #fff; margin-left: 16px; font-size: .92rem; }
        .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
        h2.section { font-size: 1.1rem; margin: 0 0 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .pcard { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
                 display: flex; flex-direction: column; }
        .pcard .photo { height: 180px; background-size: cover; background-position: center; background-color: #ddd; }
        .pcard .body { padding: 12px 14px; }
        .pcard .body h3 { margin: 0 0 2px; font-size: 1.05rem; }
        .pcard .body .place { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { font-size: .75rem; background: #f3f4f6; border: 1px solid var(--border);
               border-radius: 999px; padding: 2px 8px; }
        .score { font-weight: 600; color: var(--like); }

        .btn { display: inline-block; background: var(--brand); color: #fff; border: none;
               border-radius: 999px; padding: 10px 20px; font-size: .95rem; cursor: pointer; }
        .btn:hover { text-decoration: none; opacity: .92; }
        .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }

        .detail-head { display: flex; gap: 20px; align-items: center; background: var(--card);
                       border-radius: 14px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 24px; }
        .detail-head img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; }
        .detail-head h2 { margin: 0 0 4px; }
        .detail-head .place { color: var(--muted); }

        .row { display: flex; align-items: center; gap: 12px; background: var(--card);
               border-radius: 12px; box-shadow: var(--shadow); padding: 10px 14px; margin-bottom: 8px; }
        .row img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        .row .meta { color: var(--muted); font-size: .85rem; }

        form.profile label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
        form.profile input, form.profile select, form.profile textarea {
            width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
            font-size: .95rem; font-family: inherit; }
        form.profile .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        form.profile .checks { display: flex; gap: 20px; margin-top: 12px; }
        form.profile .checks label { display: flex; align-items: center; gap: 6px; margin: 0; }
        form.profile .checks input { width: auto; }
        .field-error { color: var(--brand); font-size: .8rem; margin-top: 4px; }
        .card-panel { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
<header class="top" th:fragment="header">
    <h1>Piso<span>Match</span> 🏠</h1>
    <nav>
        <a th:href="@{/ui/usuarios}">Usuarios</a>
        <a th:href="@{/ui/viviendas}">Viviendas</a>
        <a th:href="@{/ui/usuarios/new}">Nuevo usuario</a>
        <a th:href="@{/}">Demo swipe</a>
    </nav>
</header>
</body>
</html>
