<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PisoMatch</title>
    <style>
        :root {
            --bg: #f8fafc; --card: #fff; --ink: #111827; --muted: #4b5563;
            --brand: #e11d48; --border: #e5e7eb; --like: #16a34a;
            --shadow: 0 10px 30px rgba(15, 23, 42, .08);
        }
        * { box-sizing: border-box; }
        :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: radial-gradient(circle at top, #fff, var(--bg)); color: var(--ink); line-height: 1.6; }
        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }
        header.top { background: linear-gradient(90deg, #e11d48 0%, #f43f5e 100%); color: #fff; padding: 14px 24px;
                     display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
                     box-shadow: 0 10px 40px rgba(225, 29, 72, .18); position: sticky; top: 0; z-index: 10; }
        header.top h1 { font-size: 1.25rem; margin: 0; letter-spacing: .5px; }
        header.top h1 span { opacity: .9; font-weight: 400; }
        header.top nav { display: flex; flex-wrap: wrap; gap: 12px; }
        header.top nav a { color: #fff; font-size: .92rem; padding: 6px 10px; border-radius: 999px; }
        header.top nav a:hover { background: rgba(255,255,255,.18); text-decoration: none; }
        .container { max-width: 1080px; margin: 0 auto; padding: 32px 24px; }
        h2.section { font-size: 1.25rem; margin: 0 0 18px; font-weight: 700; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
        .pcard { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
                 display: flex; flex-direction: column; text-decoration: none; color: inherit;
                 transition: transform .18s ease, box-shadow .18s ease; border: 1px solid rgba(229,231,235,.7); }
        .pcard:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(15, 23, 42, .12); text-decoration: none; }
        .pcard:focus-visible { outline: 2px solid #2563eb; outline-offset: 4px; }
        .pcard .photo { height: 200px; background-size: cover; background-position: center; background-color: #e5e7eb; position: relative; }
        .pcard .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(15,23,42,.18), transparent 55%); }
        .pcard .body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; }
        .pcard .body h3 { margin: 0; font-size: 1.08rem; }
        .pcard .body .place { color: var(--muted); font-size: .88rem; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .tag { font-size: .76rem; background: #f9fafb; border: 1px solid var(--border);
               border-radius: 999px; padding: 2px 9px; color: var(--ink); }
        .score { font-weight: 600; color: var(--like); }

        .btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(90deg, #e11d48, #f43f5e); color: #fff; border: none;
               border-radius: 999px; padding: 10px 22px; font-size: .95rem; cursor: pointer; box-shadow: 0 12px 30px rgba(225, 29, 72, .18); }
        .btn:hover { text-decoration: none; filter: brightness(1.02); }
        .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); box-shadow: none; }

        .detail-head { display: flex; gap: 24px; align-items: center; background: var(--card);
                       border-radius: 18px; box-shadow: var(--shadow); padding: 24px; margin-bottom: 28px; flex-wrap: wrap; border: 1px solid rgba(229,231,235,.7); }
        .detail-head img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: #e5e7eb; }
        .detail-head h2 { margin: 0 0 6px; font-size: 1.8rem; }
        .detail-head .place { color: var(--muted); }

        .row { display: flex; align-items: center; gap: 14px; background: var(--card);
               border-radius: 14px; box-shadow: var(--shadow); padding: 12px 18px; margin-bottom: 10px; border: 1px solid rgba(229,231,235,.7); }
        .row img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #e5e7eb; }
        .row .meta { color: var(--muted); font-size: .88rem; }

        form.profile { display: flex; flex-direction: column; gap: 14px; }
        form.profile label { display: block; font-size: .9rem; color: var(--ink); margin-bottom: 6px; font-weight: 500; }
        form.profile input, form.profile select, form.profile textarea {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
            font-size: .98rem; font-family: inherit; background: #fff; }
        form.profile input:focus-visible, form.profile textarea:focus-visible, form.profile select:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
        form.profile .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        form.profile .checks { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 4px; }
        form.profile .checks label { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 400; }
        form.profile .checks input { width: auto; }
        .field-error { color: #dc2626; font-size: .85rem; margin-top: 6px; }
        .card-panel { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; border: 1px solid rgba(229,231,235,.7); }
        .muted { color: var(--muted); }

        @media (max-width: 640px) {
            header.top { padding: 12px 16px; }
            .container { padding: 22px 16px; }
            .detail-head { padding: 18px; }
            .card-panel { padding: 20px; }
        }
    </style>
</head>
<body>
<header class="top" th:fragment="header">
    <h1>Piso<span>Match</span> 🏠</h1>
    <nav>
        <a th:href="@{/ui/usuarios}">Usuarios</a>
        <a th:href="@{/ui/viviendas}">Viviendas</a>
        <a th:href="@{/ui/usuarios/new}">Nuevo usuario</a>
        <a th:href="@{/}">Demo swipe</a>
    </nav>
</header>
</body>
</html>
