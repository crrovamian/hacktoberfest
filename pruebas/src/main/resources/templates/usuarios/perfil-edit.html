<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<div class="container" style="max-width:720px;">
    <p style="margin-top:0;"><a th:href="@{/ui/usuarios/{id}(id=${usuarioId})}">&larr; Volver al perfil</a></p>
    <div style="margin-bottom:20px;">
        <h2 class="section" style="margin:0;">Editar perfil de convivencia</h2>
        <p class="muted" style="margin:6px 0 0;">Cómo vives y qué buscas en la convivencia de <span th:text="${usuario.nombre}">usuario</span>.</p>
    </div>

    <div class="card-panel">
        <form class="profile" method="post" th:action="@{/ui/usuarios/{id}/perfil/edit(id=${usuarioId})}" th:object="${perfilForm}">
            <div class="two">
                <div>
                    <label for="presupuesto">Presupuesto (€/mes)</label>
                    <input id="presupuesto" type="number" th:field="*{presupuesto}" min="0">
                    <div class="field-error" th:if="${#fields.hasErrors('presupuesto')}" th:errors="*{presupuesto}"></div>
                </div>
                <div>
                    <label>Ubicación</label>
                    <div style="display:flex; gap:8px; flex-direction:column;">
                        <select id="ccaaPerfil" onchange="cargarProvinciasPerfil()">
                            <option value="">Comunidad Autónoma</option>
                            <option value="Andalucía">Andalucía</option>
                            <option value="Aragón">Aragón</option>
                            <option value="Asturias">Asturias, Principado de</option>
                            <option value="Baleares">Illes Balears</option>
                            <option value="Canarias">Canarias</option>
                            <option value="Cantabria">Cantabria</option>
                            <option value="Castilla-La Mancha">Castilla-La Mancha</option>
                            <option value="Castilla y León">Castilla y León</option>
                            <option value="Cataluña">Cataluña</option>
                            <option value="Ceuta">Ceuta</option>
                            <option value="Comunidad Valenciana">Comunidad Valenciana</option>
                            <option value="Extremadura">Extremadura</option>
                            <option value="Galicia">Galicia</option>
                            <option value="Madrid">Comunidad de Madrid</option>
                            <option value="Melilla">Melilla</option>
                            <option value="Murcia">Región de Murcia</option>
                            <option value="Navarra">Navarra, Comunidad Foral de</option>
                            <option value="País Vasco">País Vasco</option>
                            <option value="La Rioja">La Rioja</option>
                        </select>
                        <select id="provinciaPerfilSel" onchange="aplicarCiudadPerfil()"></select>
                    </div>
                </div>
            </div>
            <input id="ciudad" type="hidden" th:field="*{ciudad}">

            <div>
                <label for="fechaEntrada">Fecha de entrada (opcional)</label>
                <input id="fechaEntrada" type="date" th:field="*{fechaEntrada}">
            </div>

            <div>
                <label for="habitos">Hábitos</label>
                <textarea id="habitos" rows="3" th:field="*{habitos}" placeholder="No fumo, madrugador, tengo perro..."></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('habitos')}" th:errors="*{habitos}"></div>
            </div>

            <div>
                <label for="preferencias">Preferencias de convivencia</label>
                <textarea id="preferencias" rows="3" th:field="*{preferencias}" placeholder="Busco ambiente tranquilo, limpio y respetuoso..."></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('preferencias')}" th:errors="*{preferencias}"></div>
            </div>

            <div style="margin-top:10px; display:flex; gap:12px; flex-wrap: wrap;">
                <button type="submit" class="btn">Guardar cambios</button>
                <a th:href="@{/ui/usuarios/{id}(id=${usuarioId})}" class="btn secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
const provinciasPorCCAA = {
  "Andalucía": ["Almería", "Cádiz", "Córdoba", "Granada", "Huelva", "Jaén", "Málaga", "Sevilla"],
  "Aragón": ["Huesca", "Teruel", "Zaragoza"],
  "Asturias": ["Asturias"],
  "Baleares": ["Illes Balears"],
  "Canarias": ["Las Palmas", "Santa Cruz de Tenerife"],
  "Cantabria": ["Cantabria"],
  "Castilla-La Mancha": ["Albacete", "Ciudad Real", "Cuenca", "Guadalajara", "Toledo"],
  "Castilla y León": ["Ávila", "Burgos", "León", "Palencia", "Salamanca", "Segovia", "Soria", "Valladolid", "Zamora"],
  "Cataluña": ["Barcelona", "Girona", "Lleida", "Tarragona"],
  "Ceuta": ["Ceuta"],
  "Comunidad Valenciana": ["Alicante", "Castellón", "Valencia"],
  "Extremadura": ["Badajoz", "Cáceres"],
  "Galicia": ["A Coruña", "Lugo", "Ourense", "Pontevedra"],
  "Madrid": ["Madrid"],
  "Melilla": ["Melilla"],
  "Murcia": ["Murcia"],
  "Navarra": ["Navarra"],
  "País Vasco": ["Álava", "Bizkaia", "Gipuzkoa"],
  "La Rioja": ["La Rioja"]
};

const ciudadInput = document.getElementById('ciudad');
const ccaaP = document.getElementById('ccaaPerfil');
const provP = document.getElementById('provinciaPerfilSel');

function cargarProvinciasPerfil() {
  provP.innerHTML = '';
  const ccaa = ccaaP.value;
  if (!ccaa || !provinciasPorCCAA[ccaa]) {
    aplicarCiudadPerfil();
    return;
  }
  provinciasPorCCAA[ccaa].forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    provP.appendChild(opt);
  });
  aplicarCiudadPerfil();
}

function aplicarCiudadPerfil() {
  if (provP.value) {
    ciudadInput.value = provP.value;
  } else if (ccaaP.value) {
    ciudadInput.value = ccaaP.value;
  } else {
    ciudadInput.value = '';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const actual = ciudadInput.value;
  if (!actual) return;
  for (const [ccaa, provs] of Object.entries(provinciasPorCCAA)) {
    if (provs.includes(actual)) {
      ccaaP.value = ccaa;
      cargarProvinciasPerfil();
      provP.value = actual;
      aplicarCiudadPerfil();
      return;
    }
    if (actual === ccaa) {
      ccaaP.value = ccaa;
      cargarProvinciasPerfil();
      aplicarCiudadPerfil();
      return;
    }
  }
  // Si no está en lista, mantener valor
  ciudadInput.type = 'text';
  ciudadInput.readOnly = false;
});
</script>
</body>
</html>
