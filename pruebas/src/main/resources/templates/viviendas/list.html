<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<div class="container">
    <h2 class="section">Viviendas (<span th:text="${#lists.size(viviendas)}">0</span>)</h2>

    <p th:if="${#lists.isEmpty(viviendas)}" class="muted">Todavía no hay viviendas publicadas.</p>

    <div class="grid">
        <div class="pcard" th:each="v : ${viviendas}">
            <div class="photo"
                 th:style="${#lists.isEmpty(v.fotos)} ? '' : 'background-image:url(' + ${v.fotos[0]} + ')'"></div>
            <div class="body">
                <h3 th:text="${v.zona}">Zona</h3>
                <div class="place" th:text="${v.direccion}">Dirección</div>
                <div class="tags">
                    <span class="tag" th:text="'💶 ' + ${v.precio} + '€/mes'">€</span>
                    <span class="tag" th:text="'🛏 ' + ${v.habitaciones} + ' hab.'">hab</span>
                </div>
                <div class="meta" style="margin-top:8px; font-size:.82rem;">
                    Propietario:
                    <a th:href="@{/ui/usuarios/{id}(id=${v.propietarioId})}"
                       th:text="'#' + ${v.propietarioId}">#0</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
